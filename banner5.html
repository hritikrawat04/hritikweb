<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

.picstyle{
width:95%;
height:400px ;
position:absolute ;
top:20px;
left:40px;
margin:auto;
box-shadow: 10px 10px 10px gray;
transition: 2s ease-in-out;
}


</style>
<body onload="show()">

<img class="picstyle" id="b1" src="images/b1.jpg" >
<img class="picstyle" id="b2" src="images/b2.jpg" >
<img class="picstyle" id="b3"  src="images/b3.jpg" >
<img class="picstyle" id="b4" src="images/b4.jpg" >
<img class="picstyle" id="b5" src="images/b5.jpg" >


  <script>
var c=-1
var t
//Recursive funciton

var p= document.getElementById("b1")

var p= document.getElementById("b2")

var p= document.getElementById("b3")

var p= document.getElementById("b4")

var p= document.getElementById("b5")
 
 function show()
{
 if(c<5)
{ 
c++ 

}

else{
    c=1
}

switch(c)
{
case 1:
b5.style.transform="scale(3) "    
b5.style.opacity=0
break;
case 2:
b4.style.transform="scale(3)"  
b4.style.opacity=0
break;
case 3:
b3.style.transform="scale(3)"  
b3.style.opacity=0
break;
case 4:
b2.style.transform="scale(3)"  
b2.style.opacity=0
break;
case 5:
b1.style.opacity=1;b1.style.transform="scale(1) rotate(0deg)"  
b2.style.opacity=1;b2.style.transform="scale(1) rotate(0deg)"  
b3.style.opacity=1;b3.style.transform="scale(1) rotate(0deg)"  
b4.style.opacity=1;b4.style.transform="scale(1) rotate(0deg)"  
break;


}

document.title=c
t=setTimeout("show()", 2000 )


}


//Timer object 
// var t= setInterval("show()",2000)





  </script>  


</body>
</html>
