<h1 style="text-shadow:5px 6px 6px rgb(120, 100, 71);
font-family:Arial black;font-size:50px;color:rgb(199, 234, 96);
text-align:center">  Game Characters </h1>


<style>

.pic{
  box-shadow: 5px 5px 5px rgb(205, 169, 86);
  color:white;
  margin:40px;
 cursor: pointer;
 width: 100px;
 height:100px;
 padding:5px;
 background: rgb(216, 165, 119);
 transition: 0.50s;
border-radius: 10px;
}

.pic:hover{
transform: scale(1.5)rotate(-5deg);
}


</style>
<body>
   
  <script>
  // for loop
  //syntax

  var plist=["f1.jpg","f2.jpeg","f3.jpg","f4.jpg","f5.jpg","f6.jpg"]

  for(var i =0;i<plist.length;i++)
  {
    document.write("<img src ='images/"+plist[i]+" ' class='pic'>")
   
   
  }
  </script>


</body>
