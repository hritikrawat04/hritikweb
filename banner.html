<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
header{
width:95%;
margin: auto;
text-align: center;
height: 400px;
box-shadow: 10px 10px 10px gray;

}
#pic{
width:100%;
height:400px ;

}


</style>
<body onload="show()">
<header>
<img id="pic" src="images/p10.jpeg" >
</header>
  <script>
var c=0
var t
//Recursive funciton

var p= document.getElementById("pic")
 
 function show()
{
 if(c<5)
{ 
c++ 

}

else{
    c=1
}

switch(c)
{
case 1:
p.src="images/b1.jpg"
break;
case 2:
p.src="images/b2.jpg"
break;
case 3:
p.src="images/b3.jpg"
break;
case 4:
p.src="images/b4.jpg"
break;
case 5:
p.src="images/b5.jpg"
break;


}

document.title=c
t=setTimeout("show()", 2000 )


}


//Timer object 
// var t= setInterval("show()",2000)





  </script>  


</body>
</html>
